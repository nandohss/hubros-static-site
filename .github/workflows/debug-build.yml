name: Debug build (temporário)
on:
  push:
    branches: [ci/debug-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - name: Build
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          grep -E "✓ prerender|⚠|PAGEERROR|REQFAIL|Falha|Error|CHROME|sitemap" build.log | tail -c 3800 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"}{print}' > tail.txt
          echo "::error title=run ${{ matrix.n }} exit $code os $(. /etc/os-release; echo $VERSION_ID)::$(cat tail.txt)"
          exit 0
